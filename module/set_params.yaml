# ------------------ここから1-----------------------
# 走行タイプ（レールorクローラ）
# CART_TYPE: "crawler"
CART_TYPE: "rail"

# ずんだもんの声
ZUNDA_VOICE: true
# デバッグフラグ
DEBUG: false
# 実験や検証をしたいときのフラグ（基本はFalse）
EXPERIMENT_MODE: false

# クローラ制御
crawler_params:
    # picoWのシリアルナンバー
    CRAWLER_PICO_SERIAL_NUMBER: "E6613008E3277436" # 実機と違うので変更する
    # CRAWLER_PICO_SERIAL_NUMBER: "142383138343513120F1" # デバッグ用。適当なやつ
    BAUDRATE: 115200
    
    # 各パラメータ
    INIT_DIR: 'forward'
    DEFAULT_DISTANCE_MOVEMENT: 100 # タクト動作一回あたりの移動距離[mm] ←ーーーーー変更箇所
    # DEFAULT_PULSE_MOVEMENT: 1000 # ↑のときのパルス数
    DISTANCE_LIMIT_UPPER: 250  # 最大移動距離[mm]（＝ロボット動作範囲の長さ） ←ーーーーー変更箇所
    # PULSE_LIMIT_UPPER: 10000  ↑のときの総パルス数 ※パルスの計算式：(最大距離[mm] * )/()
    PULSE_LIMIT_LOWER: 0      # 移動パルス量の下限
    DEFAULT_PWM: 63  # PWMの規定値
    TOTAL_PULSE: 0   # 累積エンコーダカウントを0に初期化

# レール制御
rail_params:
    # picoWのシリアルナンバー
    RAIL_PICO_SERIAL_NUMBER: "E66130100F9F7B2E" # 実機 
    # RAIL_PICO_SERIAL_NUMBER: "E661AC8863499927" # 実機
    # RAIL_PICO_SERIAL_NUMBER: "142383138343513120F1" # 1デバッグ用。適当なやつ
    BAUDRATE: 9600
    
    # 各パラメータ
    INIT_DIR: 'forward'
    DEFAULT_DISTANCE_MOVEMENT: 100 # タクト動作一回あたりの移動距離[mm] ←ーーーーー変更箇所
    # DEFAULT_PULSE_MOVEMENT: 144 # ↑のときのパルス数
    DISTANCE_LIMIT_UPPER: 2200  # 最大移動距離[mm]（＝レールの長さ） ←ーーーーー変更箇所 
    # PULSE_LIMIT_UPPER: 576  # ↑のときの総パルス数 ※パルスの計算式：(最大距離[mm] * 450)/(50 * 3.14)
    PULSE_LIMIT_LOWER: 0  # 移動パルス量の下限
    DEFAULT_PWM: 60  # PWMの規定値
    TOTAL_PULSE: 0  # 累積エンコーダカウントを0に初期化
    WORK_TIME_LIMIT_MIN: 100 # 実行時間min経過後、安全に初期値へ帰還

# Z軸のパラメータ
ZAxis_params:
    # picoWのシリアルナンバー
    Z_PICO_SERIAL_NUMBER: "E6613008E3567336" # 2026-11-12に確認したZ軸用Pico
    BAUDRATE: 115200

    # 俯瞰カメラの取り付け高さ(ロボットフレーム上面から)
    BACK_CAM_HEIGHT: 340 # 丸フレームで設置しているとき（小川のテクニカルチャレンジデバッグ時使用）(レールあり：310、レールなし：340)

arm_params:
    # DXL_HOME_ANGLEから[90,90,180]を引いたアーム関節角度。
    HOME_ANGLE_IN_ARM: [5.0, 150.4, -65.4]
    # 上記ホーム角と現在のLink1..Link4によるEE作用点の順運動学(mm, deg)。
    INIT_X: 13.550771
    INIT_Y: 329.524291
    INIT_ANG: 90.0
    
    OFFSET_X: 40 # EEの位置制御時、x軸方向に-50mmくらいの誤差あり

# アームモータ（Dynamixelモータ）
dxl_params: 
    # Motor coordinates = q1+90, q2+90, q3+180.
    DXL_HOME_ANGLE: [95.0, 240.4, 114.6]
    #DXL_HOME_ANGLE: [146.84 ,255.86, 47.3] # デバッグ用にホームポジションを変えるときはこっち使ってくれ
    DXL_BOX_ANGLE: [152, 258, 221]
    # DXL_BOX_ANGLE: [145, 250, 230] # デバッグ用
    MAX_ANGLE:  360.0
    ENCODER_MAX_VALUE: 4095
    
    # U2D2のシリアルナンバー
    # U2D2_SERIAL_NUMBER: "FT94VZIA"
    #U2D2_SERIAL_NUMBER: "FT6RWCQV"
    # U2D2_SERIAL_NUMBER: "FT88YXAC"
    # U2D2_SERIAL_NUMBER: "FTA7NN47"
    # U2D2_SERIAL_NUMBER: "FTAK882J"
    U2D2_SERIAL_NUMBER: "FTAK87XF"

    
    # Dynamixelの諸設定用のパラメータ
    BAUDRATE: 4000000
    PROTOCOL_VERSION: 2.0
    DXL_IDs: [1,2,3,4,5]
    ADDR_TORQUE_ENABLE: 64
    ADDR_LED_RED: 65
    LEN_LED_RED: 1
    ADDR_GOAL_POSITION: 116
    LEN_GOAL_POSITION: 4
    ADDR_PRESENT_POSITION: 132
    LEN_PRESENT_POSITION: 4
    DXL_MIN_POSITION_VALUE: 0
    DXL_MAX_POSITION_VALUE: 4095
    
    # モータの加速・減速の滑らかさの設定
    ADDR_PROFILE_ACCEL: 108
    ADDR_PROFILE_VELO: 112
    # 設定のための値
    # PROFILE_ACCELS: [15,15,10,10,15]
    PROFILE_ACCELS: [7,7,7,7,7]
    # profile_veloes: [30,30,100,100,30]
    PROFILE_VELOES: []
    
    # 各DXLモータの角度制限→※必ずDynamixel Wizardで値を確認して編集すること
    # DXL1
    DXL_1_MIN_POSI: 909 # 80[deg]
    DXL_1_MIN_DEG: 80
    DXL_1_MAX_POSI: 3074 # 270[deg]
    DXL_1_MAX_DEG: 270
    # DXL2
    DXL_2_MIN_POSI: 1022 # 90[deg]
    DXL_2_MIN_DEG: 90
    DXL_2_MAX_POSI: 3187 # 280[deg]
    DXL_2_MAX_DEG: 280
    # DXL3
    DXL_3_MIN_POSI: 681 # 60[deg]
    DXL_3_MIN_DEG: 60
    DXL_3_MAX_POSI: 3017 # 265[deg]
    DXL_3_MAX_DEG: 265
    # DXL4
    DXL_4_MIN_POSI: 1079 # 95[deg]
    DXL_4_MIN_DEG: 95
    DXL_4_MAX_POSI: 3415 # 300[deg]
    DXL_4_MAX_DEG: 300
    # DXL5
    DXL_5_MIN_POSI: 169 # 15[deg]
    DXL_5_MIN_DEG: 15
    DXL_5_MAX_POSI: 3586 # 315[deg]
    DXL_5_MAX_DEG: 315
    
    TORQUE_ENABLE: 1
    TORQUE_DISABLE: 0
    DXL_MOVING_STATUS_TH: 10
    TIMEOUT_TH: 15

# エンドエフェクタ制御
EE_params:
    # picoWのシリアルナンバー
    EE_PICO_SERIAL_NUMBER: "A437E4B324D4447A"  #91AC63E6283D43D3 
    # 各パラメータ
    BAUDRATE: 115200
    FOTO_VAL: 950 # デフォルト：1000くらい(感度指標: 値= 大きい↔小さい…感度= 高くなる↔低くなる)
    EDF_VAL: 2500 # デバッグ用(音控えめ)：1050くらい／デフォルト：1400~2000, がちで吸い込むみたいなら2500

# 自動収穫エンドエフェクタ制御
# Picoの接続情報は上のEE_params（EE_PICO_SERIAL_NUMBER / BAUDRATE）を共用する。
auto_harvest:
  # 配線: roll M1 GP10/11, rail M2 GP12/13, hook servo GP17 + FB GP28,
  # NC retract switch GP19. No pitch axis.
  hardware_profile: roll_rail_servo
  sensor_timeout_sec: 0.8
  sensor_stable_samples: 4
  # 最新4回のPicoサンプルの最大値-最小値（ファームウェアは100 ms/sample）。
  home_stability_tolerance: {pot1: 35, servo_fb: 30, enc4: 1}
  target_stable_samples: 3
  target_tolerance:
    pot1: 70
    servo_fb: 70
    enc4: 4
  sensor_limits:
    pot1: [360, 3200]
    servo_fb: [0, 4095]  # GP28のADC有効範囲。機械端点は下の校正値。
    enc4: [-50, 0]
  initial_pose:
    pot1: 1900
    servo_fb: null  # hook_servo.open_feedbackを使用。
    enc4: 0
  harvest_pose:
    enc4: -25
    servo_fb: null  # hook_servo.closed_feedbackを使用。
  # 正の論理指令に対するセンサー増加方向。サーボ方向は校正値で決まる。
  # レールカウントは原点復帰後に +退避、-伸長へ正規化。
  increase_pwm_sign: {pot1: -1, servo_fb: 1, enc4: 1}
  pwm:
    # 論理軸: pot1=ロールM1、servo_fb=フックサーボM3、enc4=レールM2。
    min: {pot1: 180, servo_fb: 180, enc4: 200}
    max: {pot1: 180, servo_fb: 220, enc4: 240}
    max_total_abs_pwm: 540
    slow_band: {pot1: 180, servo_fb: 180, enc4: 8}
  stage_timeout_sec: 20.0
  progress_timeout_sec: 20.0
  arm_return_timeout_sec: 70.0
  arm_startup_timeout_sec: 120.0
  progress_min_delta: {pot1: 3, servo_fb: 3, enc4: 1}
  progress_wrong_direction_tolerance: 2
  heartbeat_period_sec: 0.1
  serial_watchdog_sec: 0.6
  control_rate_hz: 25.0
  roll_motor:
    feedback_median_samples: 3
    direction_window_sec: 0.4
  encoder_homing:
    # 正の論理PWMでM2をGP13経由で退避。
    retract_pwm: 220
    timeout_sec: 20.0
    progress_timeout_sec: 3.0
    debounce_ms: 40
    # 初期状態でスイッチ作動中なら、NCが閉じるまで戻してから再探索する。
    release_max_counts: 4
    max_travel_counts: 70
    initial_telemetry_timeout_sec: 5.0
  hook_servo:
    neutral_us: 1500
    close_us: 1600  # オペレータ確認済みの閉じ方向。
    open_us: 1350
    # falseでも原点復帰を行い、校正待ち状態で全出力を停止する。
    # 折り返さない単調なADC範囲で両端点を測定する。
    calibration_valid: true
    open_feedback: 500
    closed_feedback: 4000
    feedback_median_samples: 3
    direction_window_sec: 0.6
  simulated_counts_per_sec: 900.0
  simulated_encoder_counts_per_sec: 30.0

# カメラ座標系→EE作用点座標系→アーム指令座標系への座標変換
# iPadの手動目標はXYZすべてに両方の平行移動を加算する。
# CAM2EEはEE作用点から見たカメラ光学中心の位置（ロボットの軸方向、mm）。
# EE2ARMのXYは撮影時のEE作用点のアーム座標。Zは撮影時のZ軸指令座標。
# Z軸指令座標と「アーム付け根から測ったEE作用点の絶対高さ」は別の値。
coordinate_transform_params:
    # カメラからEE中心の距離…ロボット座標系（トマトに向かう方向がY）※z方向…マウント設置面からEE中心まで：41mm
    # 135°マウント
    # X_DIFF_CAM2EE: 0
    # Y_DIFF_CAM2EE: 15.23
    # Z_DIFF_CAM2EE: 89.248
    # CAM_ANGLE: 35 # カメラの傾き（※地面に対して鉛直上向きを0°としたとき）
    
    # 0°マウント
    X_DIFF_CAM2EE: 0
    Y_DIFF_CAM2EE: -130 # EE作用点はカメラ光学中心より前方(+Y)へ130mm。
    Z_DIFF_CAM2EE: 60 # マウント高さ：80 エンドエフェクタ高さパラメータ
    CAM_ANGLE: 0
    
    # EE中心からアーム付け根までの距離 ※アームがホームポジションのときの距離
    # X_DIFF_EE2ARM: 0
    # Y_DIFF_EE2ARM: 162.5
    # Z_DIFF_EE2ARM: 110
    
    # カメラ取り付け部の変更時
    # X_DIFF_CAM2EE: 0
    # Y_DIFF_CAM2EE: 22
    # Z_DIFF_CAM2EE: 111
    # CAM_ANGLE: 0
    
    # EE中心からアーム付け根までの距離 ※アームがホームポジションのときの距離
    # X_DIFF_EE2ARM: 5.381867114667903
    # Y_DIFF_EE2ARM: 194.4506811183773
    # Z_DIFF_EE2ARM: 0
    # リセット姿勢で撮影するため、XYはarm_params.INIT_X/Yと一致させる。
    X_DIFF_EE2ARM: 13.550771
    Y_DIFF_EE2ARM: 329.524291
    # リセット完了時のPico応答[2,5]を基準に、EE相対高さを加算する。
    # 同じ姿勢のEE作用点の実測高さは付け根から約120mm（Z軸指令値には足さない）。
    Z_DIFF_EE2ARM: 5.0

# 画像処理関連
vision_params:
    SHOW_RESULT: true
    IMG_SAVE_DIR_PATH: "/home/ylab/hibikino_toms_ws/src/vision_pkg/vision_pkg/result/img"
    PROC_RESULT_SAVE_DIR_PATH: "/home/ylab/hibikino_toms_ws/src/vision_pkg/vision_pkg/result/proc_result"
    FILITER_TYPE: "non_filter"        # Retinexフィルタの種類（初期設定：フィルターなし）
    RIPENESS_TH_PATH: "/home/ylab/hibikino_toms_ws/src/vision_pkg/vision_pkg/modules/ripeness_th.txt"
    
    # カメラパラメータ
    camera_params:
        WIDTH: 640
        HEIGHT: 480
        FPS: 30
    
    # 推論パラメータ
    MODEL_INPUT_SIZE: 640
    WEIGHT_PATH: "/home/ylab/hibikino_toms_ws/module/weights/base.pt"     # 使用するモデルの重みのパス
    #WEIGHT_PATH: "/home/ylab/hibikino_toms_ws/module/weights/best_song.pt"     # 使用するモデルの重みのパス
    # WEIGHT_PATH:  "/home/ylab/hibikino_toms_ws/module/weights/best_Add_data.pt"     # 使用するモデルの重みのパス
    # WEIGHT_PATH:  "/home/ylab/hibikino_toms_ws/module/weights/base.engine"     # TensorRT(Jetson向けのフォオーマット)モデル
    CONF_BASE_TH: 0.1
    IOU_TH: 0.2
    MIN_AREA_TH: 1100
    
    # 画像処理のパラメータ
    APPROACH_ANG: 45 # EEの進入角度が正面以外の基準面からの角度（トマトが並ぶ方向の平面を基準面0°としたときの角度→正面は90°）
    
    # 処理に利用するための信頼度のしきい値
    CONF_MAIN_STEM_TH: 0.5 # 主茎
    CONF_PED_TH: 0.1 # 果梗
    CONF_TOM_TH: 0.5 # トマト(0.8)

# 逆運動学関連
ik_solver_params:
    # 各リンクの長さ (mm)
    # Link1: 275
    # Link2: 61.75
    # Link3: 275
    # Link4: 85
    Link1: 270 # デバッグ用
    Link2: 61.75 # デバッグ用
    Link3: 275 # デバッグ用
    Link4: 130 # Q3軸中心→EE作用点までの最終リンク方向の距離(mm)
    MAX_LOOP_NUM: 500
    GOAL_DIS: 0.01
    GOAL_ANG: 0.05
    P_DELTA_PARAM: 0.1
    A_DELTA_PARAM: 0.5 # degree


# Manual iPad target: pixel position + fixed camera-forward distance.
manual_target_params:
    FIXED_DEPTH_MM: 350.0  # 仮の開始値。カメラから目標平面までの距離に合わせて調整
    # 起動時に読み込むため、変更後はvision_service_ipadを再起動し、目標を選び直す。
    OFFSET_X_MM: 0.0  # アームX方向の加算補正(mm)。150は15cm。微調整は2〜5mmずつ。
    OFFSET_Z_MM: 40.0  # アームZ方向の加算補正(mm)。Y(奥行き)には補正を加えない。







