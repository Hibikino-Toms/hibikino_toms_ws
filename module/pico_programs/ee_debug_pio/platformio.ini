[platformio]
default_envs = ee_debug

[env:ee_debug]
build_src_filter = +<main.cpp>
; Raspberry Pi Pico 2 W (RP2350) + Arduino-Pico core
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower

monitor_speed = 115200

; The upload script selects the port by USB serial number.
; Do not hard-code /dev/ttyACM2 here because ACM numbers can change.

[env:pull_ee_teleop]
extends = env:ee_debug
build_src_filter = +<pull_main.cpp>
