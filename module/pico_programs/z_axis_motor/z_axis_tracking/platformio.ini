[platformio]
default_envs = z_axis_tracking

[env:z_axis_tracking]
platform = raspberrypi
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.arduino.earlephilhower.usb_product = Z_TRACKING_V1
lib_extra_dirs = /home/ylab/Arduino/libraries
lib_deps = symlink:///home/ylab/Arduino/libraries/Stepper
monitor_speed = 115200
upload_protocol = picotool
