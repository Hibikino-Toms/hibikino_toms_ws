backend: sim
# A neutral simulated pose with margin for the default 50 mm test circle.
initial_joints_deg: [9.38866738, 93.87929147, -38.57742594]
startup:
  # Configured joint-space startup targets, not calibration references.
  home_joints_deg: [20.0, 100.0, -30.0]
  # Configured demo yaw=90 deg; camera angular reference is a separate calibration.
  demo_joints_deg: [20.0, 100.0, -30.0]
  minimum_segment_duration_sec: 3.0
  segment_timeout_sec: 60.0
  arrival_tolerance_rad: 0.017453292519943295
simulator:
  sim_max_joint_speed_rad_s: 0.8
# Pixel-band Z correction; enable explicitly with z_tracking_enabled:=true.
# Real hardware requires module/pico_programs/z_axis_motor/z_axis_tracking firmware.
z_tracking:
  serial_number: "E6613008E3567336"  # Z Pico, from module/set_params.yaml.
  baudrate: 115200
  trigger_ratio: 0.10  # Begin at >= 1/10 of the actual image height.
  stop_ratio: 0.05     # Continue until <= 1/20; no depth conversion.
  step_m: 0.005        # Bounded move, reobserve before the next one.
  max_cycle_travel_m: 0.100
  speed_m_s: 0.010
  min_position_m: 0.005
  max_position_m: 0.450
  observation_timeout_sec: 0.30
  observation_recovery_samples: 3
  communication_timeout_sec: 0.60
  xy_stop_speed_rad_s: 0.02
  # q3 is ~0.088 deg/count. Use a bounded post-hold position window,
  # not only a 100ms derivative that amplifies 1-2 counts of quantization.
  xy_stop_window_sec: 0.50
  xy_stop_position_tolerance_rad: 0.0035
  xy_stop_max_sample_gap_sec: 0.25
  xy_stop_samples: 3
  xy_stop_timeout_sec: 5.0
  settle_sec: 0.30
  move_timeout_sec: 30.0
  home_timeout_sec: 120.0
  sim_initial_position_m: 0.225
  sim_homed: true
ik_solver_params:
  Link1: 200.0
  Link2: 0.0  # Fixed transverse offset removed from the assembled mechanism.
  Link3: 180.0  # Physical second link: q2 axis to q3 axis, operator measured.
  Link4: 75.0
  MAX_LOOP_NUM: 80
  GOAL_DIS: 0.01
  GOAL_ANG: 0.05
  position_tolerance_m: 0.002
  angle_tolerance_rad: 0.017453292519943295
  max_joint_step_rad: 0.08
  damping: 0.025
  angle_length_m: 0.15
# Joint-space limits retained from the existing five-Dynamixel mapping:
# q1=[DXL1 80..270]-90, q2=[DXL3 60..265]-90, q3=[DXL5 15..315]-180.
# These are configured software limits; confirm the mechanical envelope after
# changing the first two actuators.
joint_limits_deg:
  - [5.0, 175.0] #q1
  - [-30.0, 175.0] #q2
  - [-150.0, 120.0] #q3
# q1/q2 CAN adapter through Arduino Uno R3. Assembly calibration measured
# with base/q2/q3 axes collinear along +Y: q1=90 deg, q2=q3=0 deg.
can_mixed_backend:
  arduino_serial_number: "24236323730351504241"
  baudrate: 115200
  communication_timeout_sec: 0.8
  max_command_speed_dps: 15
  calibration_valid: true
  # q[deg] = reference_joint_deg + direction*(raw_cdeg-reference_motor_cdeg)/100
  #          + angle_trim_deg. Positive trim increases reported joint angle.
  # Changing these values requires restarting all CAN-mixed arm programs.
  q1:
    direction: -1  # Verified: positive 0xA4 angle produced increasing 0x92 angle.
    reference_joint_deg: 90.0
    reference_motor_cdeg: -11000  # Operator measured raw=-110 deg at +Y straight.
    angle_trim_deg: 0.0
  q2:
    direction: -1  # Verified: positive 0xA4 angle produced increasing 0x92 angle.
    reference_joint_deg: 0.0
    reference_motor_cdeg: 17000  # Operator measured raw=170 deg at +Y straight.
    angle_trim_deg: 0.0
  q3:
    # q3[deg] = Dynamixel_motor_deg - 180 + angle_trim_deg.
    # Operator measured existing q3 display=0 deg at the same +Y straight pose.
    angle_trim_deg: 0.0
dxl_params:
  U2D2_SERIAL_NUMBER: "FTAK87XF"
  BAUDRATE: 4000000
  PROTOCOL_VERSION: 2.0
  DXL_IDs: [1, 2, 3, 4, 5]
  q3_motor_id: 5
  ADDR_TORQUE_ENABLE: 64
  ADDR_OPERATING_MODE: 11
  ADDR_DRIVE_MODE: 10
  ADDR_GOAL_POSITION: 116
  LEN_GOAL_POSITION: 4
  ADDR_PRESENT_POSITION: 132
  LEN_PRESENT_POSITION: 4
  ADDR_PROFILE_ACCEL: 108
  ADDR_PROFILE_VELO: 112
  PROFILE_ACCELS: [7, 7, 7, 7, 7]
  # Verify profile units and safe values for the installed actuator model.
  stream_profile_velocities: [30, 30, 30, 30, 30]
  DXL_MIN_POSITION_VALUE: 0
  DXL_MAX_POSITION_VALUE: 4095
  MAX_ANGLE: 360.0
  DXL_1_MIN_DEG: 80.0
  DXL_1_MAX_DEG: 270.0
  DXL_2_MIN_DEG: 90.0
  DXL_2_MAX_DEG: 280.0
  DXL_3_MIN_DEG: 60.0
  DXL_3_MAX_DEG: 265.0
  DXL_4_MIN_DEG: 95.0
  DXL_4_MAX_DEG: 300.0
  DXL_5_MIN_DEG: 15.0
  DXL_5_MAX_DEG: 315.0
  communication_timeout_ms: 40
  # Startup-only Goal Position readback polling (not an arrival wait).
  startup_readback_timeout_ms: 250
  # Only 0 (strict) or 1 encoder count. See README for current-position checks.
  startup_hold_tolerance_ticks: 1

# The vision launch enables this cycle; circle/legacy tracker defaults stay disabled.
harvest_cycle:
  # Keep the measured visual/distance/yaw checks, but allow typical target
  # motion and tracker lag between the latest goal and measured FK.
  arrival_pixel_tolerance_px: 50.0
  arrival_distance_tolerance_m: 0.01
  arrival_goal_pose_tolerance_m: 0.05
  arrival_joint_speed_rad_s: 0.1
  arrival_yaw_tolerance_rad: 0.1
  settle_sec: 0.6
  observation_timeout_sec: 0.25
  ee_timeout_sec: 1.0
  # Return directly to startup.demo_joints_deg; no automatic Z/EE movement.
  return_min_duration_sec: 3.0
  return_timeout_sec: 60.0
  return_tolerance_rad: 0.017453292519943295
